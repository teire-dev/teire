// Teire's Gradle init script (plan S08): one test summary line per Test task (always run), a task that resolves
// every resolvable configuration (so the online warm-up downloads what offline checks need), and
// Maven Central read through Google's mirror (Central answers 403 to the sandbox's Cloudflare egress).
def MIRROR = "https://maven-central.storage-download.googleapis.com/maven2/"
def toMirror = { RepositoryHandler repos ->
  repos.withType(MavenArtifactRepository).configureEach { r ->
    def u = r.url.toString()
    if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) r.url = MIRROR
  }
}
beforeSettings { settings ->
  // Plugins published to Central (Kotlin's markers among them) come from the mirror first. Gradle
  // uses the Plugin Portal only while this list is empty, so adding the mirror would drop it: the
  // portal is added back (plugin markers such as io.spring.dependency-management live only there).
  settings.pluginManagement.repositories {
    maven { url = MIRROR; name = "teireCentralMirror" }
    gradlePluginPortal()
  }
}
settingsEvaluated { settings ->
  toMirror(settings.pluginManagement.repositories)
  toMirror(settings.dependencyResolutionManagement.repositories)
}
allprojects { p ->
  toMirror(p.repositories)
  toMirror(p.buildscript.repositories)
  p.tasks.withType(Test).configureEach { t ->
    // Every check runs the tests: an up-to-date or cached Test task prints no summary, and a
    // verification that counts nothing cannot say the tests passed (S10 evaluation, Kotlin).
    t.outputs.upToDateWhen { false }
    t.outputs.cacheIf { false }
    // The warm-up starts the test workers (so their runtime resolves) without running a test.
    if (p.hasProperty("teireWarmup")) {
      t.filter.includeTestsMatching("TeireWarmupNoTest")
      t.filter.failOnNoMatchingTests = false
    }
    t.addTestListener(new TestListener() {
      void beforeSuite(TestDescriptor d) {}
      void afterSuite(TestDescriptor d, TestResult r) {
        if (d.parent == null)
          println "TEIRE-TESTS total=${r.testCount} passed=${r.successfulTestCount} failed=${r.failedTestCount} skipped=${r.skippedTestCount}"
      }
      void beforeTest(TestDescriptor d) {}
      void afterTest(TestDescriptor d, TestResult r) {}
    })
  }
  p.tasks.register("teireResolveAll") {
    notCompatibleWithConfigurationCache("resolves configurations at execution time")
    doLast {
      p.configurations.findAll { it.canBeResolved }.each { c ->
        try { c.resolve() } catch (e) { println "teire: could not resolve ${p.path}:${c.name}: ${e.message?.readLines()?.first()}" }
      }
    }
  }
}
