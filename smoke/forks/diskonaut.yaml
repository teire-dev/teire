    from: 0.11.0
    to: 0.19.0 (the crate is deprecated in favour of ratatui)
    teire: deprecation notice with the successor named; the upgrade within tui decided by the surface diff
  - package: nix
    from: 0.17.0
    to: 0.31.x
    bump_alone: compile fails in src/os/unix.rs
    teire: affected; agent fix
