repo: teire-dev/explain-error-plugin
upstream: jenkinsci/explain-error-plugin
ecosystem: maven
manager: Maven (pom.xml, Jenkins plugin parent POM), JDK 21
baseline:
  checks: "typecheck: mvn -o test-compile; test: mvn -o verify (JenkinsRule tests start Jenkins)"
  expected: pass, or a check that hits its time limit named as such
  observed_2026_10_28: >-
    no baseline: the warm-up ran the whole test suite online and hit the 10-minute install limit twice, reported
    as "the lockfile does not install". Fixed: the warm-up resolves surefire and failsafe with a test filter that
    matches nothing (no test runs), JVM installs get 20 minutes, and a timed-out install is named as one.
    Proven on this checkout on Token Factory: warm-up BUILD SUCCESS in 502 s, offline test-compile in 9 s.
models:
  - id: gemini-2.0-flash
    status: shut down by Google on 2026-06-01
    expected: affected; swapped to gemini-3.6-flash; verified PR (S16 done-when, Java, on GitHub)
  - id: gpt-4.1-nano, gpt-4-turbo, gpt-3.5-turbo, gpt-5, gpt-5-mini, gpt-5-nano, gpt-5-pro
    status: shut down or dated by OpenAI (2026-10-23; 2026-12-11)
    expected: affected; one OpenAI PR with every swap
  - observed_2026_10_28: "#3 (OpenAI) and #4 (Gemini) opened as environment_mismatch drafts (the baseline above)"
upgrades:
  - packages: dev.langchain4j:* 1.22.0 (langchain4j, -open-ai, -google-ai-gemini, -anthropic, -ollama, -bedrock, -http-client-jdk)
    expected: queued behind the 5-open-PR cap
rewalk_2026_10_28: "observed: the install now passes (warm-up 502 s); the offline mvn -o verify then lacked surefire's JUnit provider. Fixed (the test goal runs online once in the warm-up); proven on Token Factory: the Jenkins suite runs offline and passes. Re-walk pending"
rewalk_2026_10_28_evening: "observed (run ddc8b6fa, worker 370b11b): install 792 s and warm-up 815 s pass; typecheck passes offline on both sides; the repository's own test (the Jenkins suite) ran past the 300 s check limit on the unchanged code (exit 124 in 306 s), and the agent then spent eight attempts against a limit no edit could meet. Fixed in the next commit: JVM checks get 20 minutes (VERIFY.jvmCheckTimeoutSec), a check that times out on the baseline stops the agent, and the evidence names the slow check. Re-walk after deploy."
rewalk_2026_10_28_late: "observed (run ddc8b6fa on worker 19c5571): with 20-minute JVM checks the Jenkins suite still ran past the limit on the unchanged code (exit 124 in 1,203 s); the agent was not started and the evidence named the slow test, but it ended as a needs-a-human issue. Changed next: when only the tests are too slow on both sides and the typecheck passes before and after, the evidence is typecheck_only (a draft PR that says so). Re-walk after the deploy."
rewalk_2026_10_28_night: "observed (run 176c7f24, @teire recreate, worker 1fb4810; restarted once by a deploy, attempt 2): baseline install 872 s, warm-up 823 s, typecheck passes offline before and after (12 s), the Jenkins suite runs past 20 minutes on both sides (exit 124 in 1,200 s); evidence typecheck_only; PR #4 updated as a draft labelled typecheck-only (https://github.com/teire-dev/explain-error-plugin/pull/4). Watched live on the U2 run page (https://teire.vercel.app/runs/176c7f24-c064-46da-a682-e3b292066d05): the phase strip and ledger filled from the log lines, then it flipped to Finished without a reload."
