repo: teire-dev/serve-handler
upstream: vercel/serve-handler
ecosystem: npm
manager: yarn classic (yarn.lock v1)
baseline:
  checks: "yarn test (zeit-eslint, then jest --forceExit test/integration.test.js); CI runs yarn run build-views first"
  network: tests start a server on localhost only
  expected: pass
upgrades:
  - package: path-to-regexp
    from: 3.3.0
    to: 9.0.0
    resolver: "create_pull_request: package.json and yarn.lock, path-to-regexp 9.0.0, no other package moved"
    bump_alone: tests fail; src/index.js calls the module as a function and uses pathToRegExp.compile, while 9.x is ESM with named pathToRegexp and compile exports
    teire: affected; sites in src/index.js; fixed by the agent; ready PR when the after side passes, else a draft that says which check failed
  - package: minimatch
    from: 3.1.5
    to: latest major at walk time (research saw 10.2.6; 11.0.2 on 2026-10-28)
    bump_alone: tests fail; `require('minimatch')` is called as a function, the CommonJS build only sets exports.minimatch (upstream PR #226 needed a code change, #228 reverted it)
    teire: affected; one site in src/index.js; ready PR
  - package: content-disposition
    from: 0.5.2
    to: 3.0.0
    teire: decided by the surface diff; not affected means a plain verified bump
  - package: mime-types
    from: 2.1.18
    to: 3.0.2
    teire: decided by the surface diff; not affected means a plain verified bump
