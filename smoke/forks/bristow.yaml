repo: teire-dev/bristow
upstream: andrewhampton/bristow
ecosystem: rubygems
manager: Bundler (Gemfile.lock, bristow.gemspec); Ruby 3.4.1 from .ruby-version, installed with rv
baseline:
  checks: "test: bundle exec rspec (offline, BUNDLE_FROZEN=true)"
  expected: pass, including gems with native extensions (bigdecimal through webmock → crack)
  observed_2026_10_28: >-
    failed on Token Factory: every native extension died with "Bad file descriptor - mkmf.log (Errno::EBADF)".
    The VM's root filesystem is virtiofs; the same build passes on its tmpfs. Fixed in teire-ruby (gems build
    on tmpfs there, then copied into place); proven on this checkout: 42 gems, bigdecimal loads.
models:
  - id: claude-3-5-sonnet-20241022, claude-3-haiku-20240307
    status: retired by Anthropic (2025-10-28; 2026-04-20)
    expected: affected; swapped to claude-sonnet-5-5 and claude-haiku-4-5-20251001; verified PR
  - id: gpt-3.5-turbo, gpt-3.5-turbo-0613, gpt-4
    status: shut down by OpenAI (2024-09-13; 2026-10-23)
    expected: affected; swapped to the catalog's replacements; verified PR
  - observed_2026_10_28: "#8 (OpenAI) and #9 (Anthropic) opened as environment_mismatch drafts (the baseline above); re-walk: verified or a draft naming a check"
security:
  - packages: faraday, addressable, json, rexml, uri
    resolver: "dependency_file_not_resolvable: the updater resolved on Ruby 3.0.7 (the gemspec's floor) and anthropic needs Ruby >= 3.2"
    expected: the Ruby floor is the sole cause, so Bundler resolves on the repo's Ruby 3.4.1 in the sandbox; PR at the lowest fixed version or a stop quoting Bundler
    observed_2026_10_28: "stops #3–#7 before the fallback existed; re-ask with @teire fix <gem>"
upgrades:
  - packages: simplecov 1.3.2, debug 1.11.1
    observed_2026_10_28: "#10, #11 environment_mismatch drafts (same baseline); rake, rspec, webmock queued behind the PR cap"
rewalk_2026_10_28: "observed: baseline installs (42 gems, 143/143 tests). The Anthropic swap changed the spec's model ID but not lib/bristow/providers/anthropic.rb's default_model (a literal a method returns), so 2 specs failed: regression, issue #12. Fixed in the engine (model-named definitions are located; a paired spec's equality assertion moves with the swap); re-walk pending"
