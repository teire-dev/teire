name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Python for Teire's helper tests (packaging, griffe, jedi run through uv).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
      # Go for Teire's helper tests: the helper's go.mod needs the Go the worker image ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @teire/engine test
      - run: pnpm --filter @teire/engine catalog:validate
        if: github.event_name != 'pull_request'
      # On a pull request, each contributed record it adds or changes is its author's and passes the
      # quote gate against the pages it cites (S19 review B3, B14).
      - name: catalog:validate (this pull request's records)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEIRE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TEIRE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TEIRE_PR_FILES="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')"
          export TEIRE_PR_FILES
          pnpm --filter @teire/engine catalog:validate
      # The worker ships as one ESM bundle: it must parse (a duplicate import once crashed a deploy).
      - run: pnpm --filter @teire/worker build && node --check apps/worker/dist/bundle/main.mjs
      - run: pnpm --filter @teire/web build

  # The worker's reliability against a real Postgres with Teire's migrations (plan R-M17, S21.4): the
  # reaper (runs and scans by heartbeat), event ordering, the cost cap and the 402 credit pause.
  reliability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teire
          POSTGRES_DB: teire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teire/worker test
        env:
          TEIRE_TEST_DATABASE_URL: postgres://postgres:teire@localhost:5432/teire_test

  secrets:
    # The whole history, read-only: gitleaks pinned by its release checksum (plan S21.5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml .
