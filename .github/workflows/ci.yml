name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Python for Teire's helper tests (packaging, griffe, jedi run through uv).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @teire/engine test
      - run: pnpm --filter @teire/engine catalog:validate
      - run: pnpm --filter @teire/worker build
      - run: pnpm --filter @teire/web build
      # The worker ships as one ESM bundle: it must parse (a duplicate import once crashed a deploy).
      - run: pnpm --filter @teire/worker build && node --check apps/worker/dist/bundle/main.mjs
